<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mockup-hjemmeside - visualisering af affugter</title>
  <style>
    :root {
      --ink: #14232c;
      --muted: #5b6b75;
      --line: #dfe6ea;
      --bg: #ffffff;
      --soft: #f3f6f8;
      --accent: #3f8fbf;
      --accent-dark: #2c6f99;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header.site {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    header.site .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: .01em; white-space: nowrap; }
    .logo svg { width: 28px; height: 28px; color: var(--accent); }
    nav.main { display: flex; gap: 28px; font-size: 15px; color: var(--muted); }
    nav.main a:hover { color: var(--ink); }

    /* Hero */
    .hero { padding: 64px 0 36px; background: linear-gradient(180deg, var(--soft), #fff); }
    .hero .wrap { max-width: 860px; text-align: center; }
    .eyebrow { color: var(--accent-dark); font-weight: 600; letter-spacing: .12em; font-size: 13px; text-transform: uppercase; }
    h1 { font-size: clamp(34px, 5vw, 54px); line-height: 1.08; margin: 14px 0 0; letter-spacing: -.02em; }

    /* Visualizer */
    .viz-section { padding: 8px 0 72px; }
    .viz-frame {
      border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
      box-shadow: 0 24px 60px -24px rgba(20, 50, 70, .35);
      background: #dfe8ee;
    }
    .viz-frame iframe { display: block; width: 100%; height: 72vh; min-height: 460px; max-height: 760px; border: 0; }
    .viz-caption {
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 14px 4px 0; font-size: 14px; color: var(--muted);
    }

    footer { padding: 28px 0; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
    footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

    @media (max-width: 860px) {
      nav.main { display: none; }
      .logo { font-size: 18px; }
      .hero { padding-top: 40px; }
      .viz-frame iframe { height: 68vh; min-height: 420px; }
    }
  </style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="#top">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M36 8C36 8 17 29 17 43.5C17 54.27 25.51 63 36 63C46.49 63 55 54.27 55 43.5C55 29 36 8 36 8Z" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
      </svg>
      Firmanavn
    </a>
    <nav class="main">
      <a href="#visualizer">Udforsk</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="eyebrow">Industriel affugtning</div>
      <h1>Se præcis, hvordan den virker, fra alle vinkler</h1>
    </div>
  </section>

  <section class="viz-section" id="visualizer">
    <div class="wrap">
      <div class="viz-frame">
        <!-- Indlejring som beskrevet i docs/EMBEDDING.md -->
        <iframe
          src="visualizer/index.html"
          title="Visualisering af maskinen"
          allow="fullscreen"
          allowfullscreen
          loading="lazy"></iframe>
      </div>
      <div class="viz-caption">
        <span>Træk for at rotere &middot; scroll eller knib for at zoome</span>
        <span>Interaktiv 3D-model</span>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>&copy; Firmanavn &middot; Mockup-side til visualiseringen</span>
    <span>Privatliv &middot; Vilkår</span>
  </div>
</footer>

</body>
</html>
